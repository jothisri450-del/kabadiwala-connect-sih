<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Collector - Kabadiwala Connect</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            color: #26352b;
        }

        /* HEADER */

        .header {
            background: #1f7a35;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 9px 15px;
            border-radius: 8px;
        }

        .back:hover {
            background: rgba(255,255,255,0.25);
        }


        /* MAIN */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }


        /* TITLE CARD */

        .title-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .title-card h1 {
            color: #1f7a35;
            margin-bottom: 10px;
        }

        .title-card p {
            color: #68756d;
            line-height: 1.6;
        }


        /* STATUS */

        .status {
            background: #eaf6ed;
            color: #207b34;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }


        /* MAP */

        #map {
            width: 100%;
            height: 550px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
            border: 3px solid white;
        }


        /* LOCATION INFO */

        .location-info {
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .location-info h3 {
            color: #1f7a35;
            margin-bottom: 12px;
        }

        .coordinates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .coordinate-box {
            background: #f2f8f3;
            padding: 15px;
            border-radius: 10px;
        }

        .coordinate-box strong {
            display: block;
            margin-bottom: 5px;
            color: #286c38;
        }

        .coordinate-box span {
            color: #5f6d63;
        }


        /* REFRESH */

        .refresh-info {
            margin-top: 15px;
            text-align: center;
            color: #68756d;
            font-size: 14px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .header {
                flex-direction: column;
                gap: 12px;
            }

            #map {
                height: 450px;
            }

            .coordinates {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        ♻️ Kabadiwala Connect
    </div>

    <a href="/customer_dashboard" class="back">
        ← Dashboard
    </a>

</div>



<!-- MAIN -->

<div class="container">


    <!-- TITLE -->

    <div class="title-card">

        <h1>
            📍 Live Collector Tracking
        </h1>

        <p>
            Track the collector's latest shared
            location on the map.
        </p>

    </div>



    <!-- STATUS -->

    <div id="status" class="status">

        🔄 Searching for collector location...

    </div>



    <!-- MAP -->

    <div id="map"></div>



    <!-- LOCATION INFORMATION -->

    <div class="location-info">

        <h3>
            🚚 Collector Location
        </h3>

        <div class="coordinates">

            <div class="coordinate-box">

                <strong>
                    Latitude
                </strong>

                <span id="latitude">
                    Waiting...
                </span>

            </div>


            <div class="coordinate-box">

                <strong>
                    Longitude
                </strong>

                <span id="longitude">
                    Waiting...
                </span>

            </div>

        </div>


        <div class="refresh-info">

            🔄 Location automatically updates every
            5 seconds.

        </div>

    </div>


</div>



<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* CREATE MAP */

let map = L.map("map").setView(
    [11.0168, 76.9558],
    10
);


/* OPENSTREETMAP */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
        "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* COLLECTOR MARKER */

let collectorMarker = null;


/* GET COLLECTOR LOCATION */

function updateCollectorLocation() {

    fetch("/get_collector_location")

    .then(response => response.json())

    .then(data => {

        const status =
            document.getElementById("status");


        if (data.success) {

            const latitude =
                parseFloat(data.latitude);

            const longitude =
                parseFloat(data.longitude);


            /*
             * UPDATE LATITUDE
             */

            document.getElementById("latitude")
                .innerHTML =
                latitude.toFixed(6);


            /*
             * UPDATE LONGITUDE
             */

            document.getElementById("longitude")
                .innerHTML =
                longitude.toFixed(6);


            /*
             * CREATE MARKER
             */

            if (collectorMarker === null) {

                collectorMarker =
                    L.marker([
                        latitude,
                        longitude
                    ])
                    .addTo(map);


                collectorMarker.bindPopup(
                    "🚚 Collector is here"
                );


                collectorMarker.openPopup();


                /*
                 * MOVE MAP TO COLLECTOR
                 */

                map.setView(
                    [
                        latitude,
                        longitude
                    ],
                    15
                );

            }

            else {

                /*
                 * MOVE EXISTING MARKER
                 */

                collectorMarker.setLatLng([
                    latitude,
                    longitude
                ]);

            }


            /*
             * STATUS
             */

            status.innerHTML =
                "🟢 Collector location received<br>" +
                "Last updated: " +
                data.updated_at;

        }

        else {

            status.innerHTML =
                "🟡 Collector has not shared " +
                "a location yet.";

        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById("status")
            .innerHTML =
            "❌ Unable to get collector location.";

    });

}



/*
 * LOAD LOCATION IMMEDIATELY
 */

updateCollectorLocation();



/*
 * UPDATE EVERY 5 SECONDS
 */

setInterval(
    updateCollectorLocation,
    5000
);


</script>


</body>

</html>
