<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at top left,
                    #c8e6c9,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #a5d6a7,
                    transparent 35%
                ),
                #f1f8e9;
        }

        .card {
            width: 90%;
            max-width: 480px;

            background: white;

            padding: 45px 35px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e8f5e9;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 50px;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .welcome {
            font-size: 20px;
            font-weight: bold;
            color: #333;

            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 30px;

            background: #2e7d32;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        .button:hover {
            background: #1b5e20;
        }

        .home {
            display: block;

            margin-top: 15px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .home:hover {
            color: #2e7d32;
        }

    </style>

</head>


<body>


    <div class="card">

        <div class="icon">
            ✅
        </div>


        <h1>
            Registration Successful!
        </h1>


        <div class="welcome">
            Welcome, {{ name }}! 🎉
        </div>


        <p>
            Your Kabadiwala Connect account
            has been created successfully.
        </p>


        <p>
            You can now login and start using
            the platform.
        </p>


        <a href="/login" class="button">
            🔐 Login Now
        </a>


        <a href="/" class="home">
            ← Back to Home
        </a>

    </div>


</body>

</html>
